<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>e6paper PicoRuby emulator — M5PaperColor (ED2208-DOA)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    background: #f4f4f2;
  }
  .panel {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
  }
  .panel h1 { font-size: 16px; margin: 0 0 12px; }
  #epd {
    width: 400px;
    height: 600px;
    image-rendering: pixelated;
    border: 12px solid #2a2a2a;
    border-radius: 4px;
    background: #fff;
  }
  .controls { margin-top: 12px; display: flex; gap: 8px; }
  button {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .side { flex: 1; min-width: 320px; max-width: 520px; }
  .side pre {
    font-size: 11px;
    line-height: 1.4;
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 10px;
    border-radius: 6px;
    height: 260px;
    overflow: auto;
  }
  .side h2 { font-size: 13px; margin: 12px 0 6px; }
  #status { font-size: 12px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
  <div class="panel">
    <h1>M5PaperColor — virtual ED2208-DOA panel (400×600)</h1>
    <canvas id="epd" width="400" height="600"></canvas>
    <div class="controls">
      <button id="btnA">BtnA (GPIO 10) — rotate</button>
      <button id="btnReset">Reset VM</button>
    </div>
    <div id="status">waiting for Ruby…</div>
  </div>
  <div class="side">
    <div class="panel">
      <h1>App source: picoruby/app.rb (same code runs on device)</h1>
      <h2>ED2208 command log</h2>
      <pre id="log"></pre>
      <h2>M5PM1 (PMIC) I2C writes</h2>
      <pre id="i2clog"></pre>
    </div>
  </div>
  <script src="epd_emulator.js"></script>
  <script src="./picoruby_wasm/init.iife.js"></script>
  <script type="text/ruby" src="app_bundle.rb?v=13"></script>
  <script>
    // Simulate pressing BtnA (active low) for 300ms on click.
    let pressTimer = null;
    document.getElementById("btnA").addEventListener("click", () => {
      window.__epd_btn_a_pressed = true;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => { window.__epd_btn_a_pressed = false; }, 300);
    });
    document.getElementById("btnReset").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
